<style>

*{box-sizing:border-box}html,body{margin:0}

.cdots{display:inline-flex;gap:3px;vertical-align:-2px;margin-inline-end:6px}
.lang{flex:none;min-height:36px;padding:0 14px;border-radius:18px;font-size:14px;font-weight:600}

.lang[lang=ar]{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}
.cdots i{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.18);display:inline-block}

button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #7cc4b6;outline-offset:2px}
.b-ok.on{background:var(--teal);border-color:var(--teal);color:#fff}
.b-ch.on{background:var(--orange);border-color:var(--orange);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{min-height:36px;border-radius:18px;font-size:13px;padding:0 14px}
textarea,input{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical;margin-top:10px}
.err{color:var(--red);font-size:13px;margin-top:6px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:baseline}
.tot{font:700 22px "Bricolage Grotesque",sans-serif}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.bar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1.5fr;gap:10px;align-items:center}
.prog{font-size:12px;color:var(--muted);grid-column:1/-1;text-align:center}
.send{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.send[disabled]{opacity:.6}
.done{text-align:center;padding:40px 18px}
.done .big{width:72px;height:72px;border-radius:50%;background:var(--teal);color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}

", "thxApproved": "شكرًا لموافقتك على {0}! سنبدأ العمل على طلبك ونطلعك على التقدّم عبر واتساب.", "replySent": "تم إرسال الرد", "waChanges": "أرسلت تعديلاتي على {0}.", "waApproved": "وافقت على {0}.", "qty": "الكمية", "each": "للقطعة", "cur": "درهم", "colour": "اللون", "loading": "جارٍ تحميل التفاصيل…", "incomplete": "هذا الرابط غير مكتمل", "askAgain": "اطلب من Talli 3D Printing إرساله مرة أخرى عبر واتساب.", "notReady": "الرابط غير جاهز بعد", "tryMinute": "يرجى المحاولة بعد دقيقة، أو اطلب من Talli 3D Printing إرساله مرة أخرى عبر واتساب."}};
var LANG = (function(){
  try{ var q = (location.search.match(/[?&]lang=(ar|en)(?:&|$)/) || [])[1]; if(q) return q;
       var v = localStorage.getItem("talli_lang"); if(v === "ar" || v === "en") return v; }catch(e){}
  return /^ar/i.test(navigator.language || "") ? "ar" : "en";
})();
function t(k){ var a = [].slice.call(arguments, 1), v = (TX[LANG] && TX[LANG][k] != null) ? TX[LANG][k] : TX.en[k];
  return typeof v === "string" ? v.replace(/\{(\d)\}/g, function(_, i){ return a[i]; }) : v; }
function applyLang(){ document.documentElement.lang = LANG; document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr"; }
applyLang();
var redraw = null;
function langBtn(){ return '<button class="lang" id="langBtn" type="button" lang="' + (LANG === "ar" ? "en" : "ar") + '">' + (LANG === "ar" ? "English" : "عربي") + '</button>'; }
document.addEventListener("click", function(e){
  if(!e.target.closest("#langBtn")) return;
  LANG = LANG === "ar" ? "en" : "ar"; try{ localStorage.setItem("talli_lang", LANG); }catch(_){}
  applyLang(); if(redraw) redraw();
});
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function money(v){ var n = Number(v||0).toFixed(2); return LANG === "ar" ? n + " " + t("cur") : "AED " + n; }

// ---------- invoice page: confirm the order arrived and/or that payment was sent ----------
function qtyLine(x){
  var q = Math.max(1, Math.round(Number(x[2]) || 1));
  return '<div class="qty">' + t("qty") + ' <b>' + q + '</b>' + (q > 1 ? ' × ' + money(Number(x[3] || 0) / q) + ' ' + t("each") : '') + '</div>';
}
function cdots(x){
  var c = Array.isArray(x[5]) ? x[5].filter(function(v){ return v === "multi" || /^#[0-9a-f]{6}$/i.test(v); }).slice(0, 4) : [];
  if(!c.length) return "";

function invoicePage(){

    if(D.pay) h += '<div class="card"><div class="sub" style="margin-bottom:4px">' + t("howPay") + '</div><div style="white-space:pre-line">' + esc(D.pay) + '</div></div>';

         (pick.paid ? '<label for="rf">' + t("refLabel") + '</label><input id="rf" value="' + esc(refVal) + '" placeholder="' + t("refPh") + '">' : '') + '</div>';
    h += '<div class="card"><label for="nm">' + t("yourName") + '</label><input id="nm" value="' + esc(nameVal) + '" autocomplete="name"><label for="cm">' + t("anything") + '</label><textarea id="cm" placeholder="' + t("phInv") + '">' + esc(commentVal) + '</textarea></div>';

    if(pick.rec && pick.paid) notes.push("Order received and payment sent");
    if(pick.paid && refVal.trim()) notes.push("Payment: " + refVal.trim());
    if(commentVal.trim()) notes.push("Note: " + commentVal.trim());

function start(){

} else if(D.k === "i"){

      h += '<div class="acts"><button class="b-ok' + (s.s === "ok" ? " on" : "") + '" data-i="' + i + '" data-a="ok" aria-pressed="' + (s.s === "ok") + '">' + t("approve") + '</button><button class="b-ch' + (s.s === "ch" ? " on" : "") + '" data-i="' + i + '" data-a="ch" aria-pressed="' + (s.s === "ch") + '">' + t("change") + '</button></div>';
      if(s.s === "ch"){
        h += '<textarea data-n="' + i + '" placeholder="' + t("changePh") + '" aria-label="' + t("changeFor", esc(x[0])) + '">' + esc(s.note) + '</textarea><div class="chips">' +
          t("chips").map(function(c){ return '<button data-c="' + i + '" data-v="' + c + '">' + c + '</button>'; }).join("") + '</div>' +
          (s.miss ? '<div class="err">' + t("tellUs") + '</div>' : '');
      }
      h += '</div>';
    });
    h += '<div class="card"><div class="row"><span>' + t("total") + '</span><span class="tot">' + money(D.t) + '</span></div>' + (D.x ? '<div class="sub">' + esc(D.x) + '</div>' : '') + '</div>';
    h += '<div class="card"><label for="nm">' + t("yourName") + '</label><input id="nm" value="' + esc(nameVal) + '" autocomplete="name"><label for="cm">' + t("anything") + '</label><textarea id="cm" placeholder="' + t("phQuote") + '">' + esc(commentVal) + '</textarea></div>';
    app.innerHTML = h;
    drawBar();
  }
  redraw = draw;
  function drawBar(msg){
    var k = st.filter(function(s){ return s.s; }).length, c = st.filter(function(s){ return s.s === "ch"; }).length;
    bar.innerHTML = '<div class="in"><div class="prog" id="prog"' + (msg ? ' style="color:#b42318"' : '') + '>' + (msg || (t("checked", k, st.length) + (c ? t("changes", c) : ''))) + '</div><button id="all">' + t("approveAll") + '</button><button class="send" id="send">' + t("sendReply") + '</button></div>';
  }

  app.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    if(b.dataset.a){
      var i = +b.dataset.i;
      st[i].s = st[i].s === b.dataset.a ? "" : b.dataset.a; st[i].miss = false; st[i].need = false;
      draw();
      if(st[i].s === "ch"){ var t = document.querySelector('[data-n="' + i + '"]'); if(t) t.focus(); }
    }
    if(b.dataset.c){
      var j = +b.dataset.c;
      st[j].note = (st[j].note ? st[j].note.replace(/\s+$/, "") + ", " : "") + b.dataset.v + ": ";
      st[j].miss = false; draw();
      var t2 = document.querySelector('[data-n="' + j + '"]');
      if(t2){ t2.focus(); t2.setSelectionRange(t2.value.length, t2.value.length); }
    }
  });
  app.addEventListener("input", function(e){
    if(e.target.dataset.n != null) st[+e.target.dataset.n].note = e.target.value;
    if(e.target.id === "nm") nameVal = e.target.value;
    if(e.target.id === "cm") commentVal = e.target.value;
  });

  bar.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b || sent) return;
    if(b.id === "all"){ st.forEach(function(s){ if(!s.s){ s.s = "ok"; s.need = false; } }); draw(); return; }
    if(b.id !== "send") return;
    var first = -1;
    st.forEach(function(s, i){
      if(!s.s){ s.need = true; if(first < 0) first = i; }
      if(s.s === "ch" && !s.note.trim()){ s.miss = true; if(first < 0) first = i; }
    });
    if(first >= 0){ draw(); drawBar(t("answerAll")); document.getElementById("ln" + first).scrollIntoView({behavior:"smooth", block:"center"}); return; }

    var changes = D.l.map(function(x, i){ return st[i].s === "ch" ? x[0] + ": " + st[i].note.trim() : ""; }).filter(Boolean);
    var approved = D.l.filter(function(x, i){ return st[i].s === "ok"; }).map(function(x){ return x[0]; });
    var notes = changes.join("\n");
    if(changes.length && approved.length) notes += "\nApproved: " + approved.join(", ");
    if(commentVal.trim()) notes += (notes ? "\n" : "") + "Note: " + commentVal.trim();
    notes = "[Approval page]" + (notes ? "\n" + notes : "");

    var body = new URLSearchParams();
    body.append(E.no, D.n); body.append(E.code, D.c || ""); body.append(E.name, (nameVal || "").trim() || D.cn || "Client");
    body.append(E.resp, changes.length ? "Request changes" : "Approve as quoted"); body.append(E.notes, notes.slice(0, 1800));

    b.disabled = true; b.textContent = t("sending");
    fetch(FORM, {method:"POST", mode:"no-cors", body: body})
      .then(function(){ sent = true; done(changes.length); })
      .catch(function(){ b.disabled = false; b.textContent = t("tryAgain"); drawBar(t("cantSend")); });
  });

  function done(ch){
    bar.remove();
    var msg = ch ? t("thxChanges", D.n) : t("thxApproved", D.n);
    var wa = D.p ? "https://wa.me/" + D.p + "?text=" + encodeURIComponent(ch ? t("waChanges", D.n) : t("waApproved", D.n)) : "";
    app.innerHTML = '<div class="done"><div class="big">&#10003;</div><h1>' + t("replySent") + '</h1><p>' + esc(msg) + '</p>' + (wa ? '<a class="wa" href="' + wa + '">' + t("backWa") + '</a>' : '') + '</div>';
    window.scrollTo(0, 0);
  }
  draw();
}
}

// ---------- short links: ?k=<12-char key>; the details are stored encrypted in the Talli link store sheet ----------
var STORE_SHEET = "1Z1U1eL7RAJiCRhAOU8O9AnjTfTl6ANzCMU_k1TBNogM", STORE_GID = "383189794";
function sha(s){ return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function(b){ return new Uint8Array(b); }); }
function hex(u){ return Array.prototype.map.call(u, function(x){ return ("0" + x.toString(16)).slice(-2); }).join(""); }
function openBox(k, b64){
  var raw = atob(b64), bytes = new Uint8Array(raw.length);
  for(var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  return sha("talli-key:" + k)
    .then(function(kb){ return crypto.subtle.importKey("raw", kb, "AES-GCM", false, ["decrypt"]); })
    .then(function(key){ return crypto.subtle.decrypt({name:"AES-GCM", iv:bytes.slice(0, 12)}, key, bytes.slice(12)); })
    .then(function(pt){ var d = JSON.parse(new TextDecoder().decode(pt)); if(!(d && d.n && Array.isArray(d.l))) throw 0; return d; });
}
function loadShort(k, tries){
  sha("talli-id:" + k).then(function(h){
    var id = hex(h).slice(0, 24), cb = "talli" + Date.now(), s = document.createElement("script"), settled = false;
    function again(){
      if(settled) return; settled = true; s.remove(); try{ delete window[cb]; }catch(e){}
      if(tries < 5) setTimeout(function(){ loadShort(k, tries + 1); }, 2000);
      else { app.innerHTML = '<div class="done"><h1>' + t("notReady") + '</h1><p class="sub">' + t("tryMinute") + '</p></div>'; }
    }
    window[cb] = function(r){
      var v = null;
      try{ v = r.table.rows[0].c[0].v; }catch(e){}
      if(!v){ again(); return; }
      settled = true; s.remove();
      openBox(k, v).then(function(d){ D = d; bar.style.display = ""; start(); })
        .catch(function(){ app.innerHTML = '<div class="done"><h1>' + t("incomplete") + '</h1><p class="sub">' + t("askAgain") + '</p></div>'; });
    };
    s.onerror = again;
    setTimeout(again, 12000);
    s.src = "https://docs.google.com/spreadsheets/d/" + STORE_SHEET + "/gviz/tq?gid=" + STORE_GID + "&tqx=responseHandler:" + cb +
      "&tq=" + encodeURIComponent("select C where B = '" + id + "' order by A desc limit 1");
    document.head.appendChild(s);
  });
}
var K = (location.search.match(/[?&]k=([A-Za-z0-9]{12})(?:&|$)/) || [])[1];
if(!D && K && window.crypto && crypto.subtle){
  app.innerHTML = '<div class="done"><p class="sub">' + t("loading") + '</p></div>';
  bar.style.display = "none";
  loadShort(K, 0);
} else start();
</script>
