<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Talli 3D Printing</title>
<meta name="description" content="Your quotation or invoice from Talli 3D Printing. Review, approve or confirm payment.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Talli 3D Printing">
<meta property="og:title" content="Talli 3D Printing – your quotation &amp; invoice">
<meta property="og:description" content="Review your items, approve or request changes, and confirm delivery or payment.">
<meta property="og:image" content="https://talli3d.github.io/talli/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<style>
/* Talli client quote approval: one card per item, Approve / Change buttons, sticky reply bar */
:root{--ink:#17201f;--muted:#5d6a68;--line:#d5dcda;--bg:#eef1f0;--card:#fff;--teal:#0f6b5f;--teal-soft:#e1f0ec;--orange:#c4610f;--orange-soft:#fff2e3;--red:#b42318}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-right)) 130px max(14px,env(safe-area-inset-left))}
header{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font:700 22px "Bricolage Grotesque",sans-serif;flex:none}
h1{font:700 20px/1.15 "Bricolage Grotesque",sans-serif;margin:0}
.sub{color:var(--muted);font-size:13px}
.intro{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.warn{background:var(--orange-soft);color:#7a3d06;border-radius:10px;padding:8px 12px;font-size:13px;margin-top:8px}
.ln{background:var(--card);border:2px solid transparent;border-radius:14px;padding:14px;margin-bottom:12px;transition:border-color .15s,background .15s}
.ln.ok{border-color:var(--teal);background:var(--teal-soft)}
.ln.ch{border-color:var(--orange);background:var(--orange-soft)}
.ln.need{border-color:var(--red)}
.top{display:flex;gap:12px;align-items:flex-start}.top .tx{flex:1;min-width:0}
.cdots{display:inline-flex;gap:3px;vertical-align:-2px;margin-right:6px}
.cdots i{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.18);display:inline-block}
.pic{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:#eef1f0}
.qty{display:inline-block;margin-top:6px;font-size:13px;background:#eef1f0;border-radius:8px;padding:3px 9px;color:var(--ink)}
.pic.sm{width:48px;height:48px;border-radius:8px}
.nm{font-weight:600;font-size:16px}.ds{color:var(--muted);font-size:13px}.pr{font-weight:600;white-space:nowrap}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);min-height:48px;padding:0 14px;touch-action:manipulation}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #7cc4b6;outline-offset:2px}
.b-ok.on{background:var(--teal);border-color:var(--teal);color:#fff}
.b-ch.on{background:var(--orange);border-color:var(--orange);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{min-height:36px;border-radius:18px;font-size:13px;padding:0 14px}
textarea,input{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical;margin-top:10px}
.err{color:var(--red);font-size:13px;margin-top:6px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:baseline}
.tot{font:700 22px "Bricolage Grotesque",sans-serif}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.bar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1.5fr;gap:10px;align-items:center}
.prog{font-size:12px;color:var(--muted);grid-column:1/-1;text-align:center}
.send{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.send[disabled]{opacity:.6}
.done{text-align:center;padding:40px 18px}
.done .big{width:72px;height:72px;border-radius:50%;background:var(--teal);color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.wa{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:12px;background:#1f8f4e;color:#fff;text-decoration:none;font-weight:600;margin-top:16px}
@media (prefers-reduced-motion:reduce){.ln{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bar" id="bar"></div>
<script>
// Replies are submitted to the Talli Google Form in the background (no sign-in needed).
var FORM = "https://docs.google.com/forms/d/e/1FAIpQLSeVXoesgCeUuPyGDBgYoTJ_YbI-7hSQ5nJ9HYcwZXopEHimzg/formResponse";
var E = {no:"entry.903784828", code:"entry.1026344090", name:"entry.165134816", resp:"entry.77146658", notes:"entry.1927469888"};

function readData(){
  try{
    var m = (location.hash.match(/[#&]d=([^&]+)/) || location.search.match(/[?&]d=([^&]+)/));
    if(!m) return null;
    var b = decodeURIComponent(m[1]).replace(/-/g,"+").replace(/_/g,"/");
    while(b.length % 4) b += "=";
    var d = JSON.parse(decodeURIComponent(escape(atob(b))));
    return (d && d.n && Array.isArray(d.l)) ? d : null;
  }catch(e){ return null; }
}
var D = readData(), app = document.getElementById("app"), bar = document.getElementById("bar");
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function money(v){ return "AED " + Number(v||0).toFixed(2); }

// ---------- invoice page: confirm the order arrived and/or that payment was sent ----------
function qtyLine(x){
  var q = Math.max(1, Math.round(Number(x[2]) || 1));
  return '<div class="qty">Qty <b>' + q + '</b>' + (q > 1 ? ' × ' + money(Number(x[3] || 0) / q) + ' each' : '') + '</div>';
}
function cdots(x){
  var c = Array.isArray(x[5]) ? x[5].filter(function(v){ return v === "multi" || /^#[0-9a-f]{6}$/i.test(v); }).slice(0, 4) : [];
  if(!c.length) return "";
  return '<span class="cdots" aria-label="Colour">' + c.map(function(v){
    return '<i style="background:' + (v === "multi" ? "conic-gradient(#e0b13a,#2f6fde,#2a9d4b,#e0b13a)" : v) + '"></i>'; }).join("") + '</span>';
}
function pic(x, cls){
  var m = x[4];
  return (typeof m === "string" && m.length < 20000 && /^[A-Za-z0-9+\/]+=*$/.test(m)) ? '<img class="pic' + (cls ? ' ' + cls : '') + '" src="data:image/jpeg;base64,' + m + '" alt="">' : '';
}
function invoicePage(){
  document.title = (D.b || "Talli 3D Printing") + " – " + D.n;
  var pick = {rec:false, paid:false}, nameVal = D.cn || "", refVal = "", commentVal = "", sent = false;
  function draw(){
    var h = '<header><div class="logo">T</div><div><h1>' + esc(D.b || "Talli 3D Printing") + '</h1><div class="sub">Invoice ' + esc(D.n) + (D.cn ? ' · for ' + esc(D.cn) : '') + '</div></div></header>';
    h += '<div class="intro">Thanks for your order! Tap below to let us know when it arrives and when you\'ve paid.' + (D.v ? '<div class="sub" style="margin-top:4px">Due by ' + esc(D.v) + '</div>' : '') + '</div>';
    h += '<div class="card">' + D.l.map(function(x){ return '<div class="top" style="padding:6px 0;border-bottom:1px solid #eef1f0">' + pic(x, "sm") + '<div class="tx"><div class="nm" style="font-size:15px">' + esc(x[0]) + '</div><div class="ds">' + cdots(x) + esc(x[1] || "") + '</div>' + qtyLine(x) + '</div><div class="pr">' + money(x[3]) + '</div></div>'; }).join("") +
         '<div class="row" style="margin-top:10px"><span>Total</span><span class="tot">' + money(D.t) + '</span></div>' + (D.x ? '<div class="sub">' + esc(D.x) + '</div>' : '') +
         (D.pd > 0 ? '<div class="row"><span class="sub">Paid</span><span>' + money(D.pd) + '</span></div><div class="row" style="margin-top:4px"><b>Balance due</b><b>' + money(D.bal) + '</b></div>' : '') + '</div>';
    if(D.pay) h += '<div class="card"><div class="sub" style="margin-bottom:4px">How to pay</div><div style="white-space:pre-line">' + esc(D.pay) + '</div></div>';
    h += '<div class="ln' + (pick.rec ? ' ok' : '') + '"><button class="b-ok' + (pick.rec ? ' on' : '') + '" data-p="rec" aria-pressed="' + pick.rec + '" style="width:100%">&#128230; I\'ve received my order</button></div>';
    h += '<div class="ln' + (pick.paid ? ' ok' : '') + '"><button class="b-ok' + (pick.paid ? ' on' : '') + '" data-p="paid" aria-pressed="' + pick.paid + '" style="width:100%">&#128179; I\'ve paid</button>' +
         (pick.paid ? '<label for="rf">Transfer reference or amount (optional)</label><input id="rf" value="' + esc(refVal) + '" placeholder="e.g. 34 AED, ref 12345">' : '') + '</div>';
    h += '<div class="card"><label for="nm">Your name</label><input id="nm" value="' + esc(nameVal) + '" autocomplete="name"><label for="cm">Anything else? (optional)</label><textarea id="cm" placeholder="Feedback, questions…">' + esc(commentVal) + '</textarea></div>';
    app.innerHTML = h; drawBar();
  }
  function drawBar(msg){
    bar.innerHTML = '<div class="in"><div class="prog" id="prog"' + (msg ? ' style="color:#b42318"' : '') + '>' + (msg || (pick.rec || pick.paid ? "Ready to send" : "Choose at least one")) + '</div><button class="send" id="send" style="grid-column:1/-1">Send</button></div>';
  }
  app.addEventListener("click", function(e){ var b = e.target.closest("button"); if(!b || !b.dataset.p) return; pick[b.dataset.p] = !pick[b.dataset.p]; draw(); });
  app.addEventListener("input", function(e){ if(e.target.id === "nm") nameVal = e.target.value; if(e.target.id === "cm") commentVal = e.target.value; if(e.target.id === "rf") refVal = e.target.value; });
  bar.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b || b.id !== "send" || sent) return;
    if(!pick.rec && !pick.paid){ drawBar("Tap \"received\" or \"paid\" first"); return; }
    var notes = ["[Invoice page]"];
    if(pick.rec && pick.paid) notes.push("Order received and payment sent");
    if(pick.paid && refVal.trim()) notes.push("Payment: " + refVal.trim());
    if(commentVal.trim()) notes.push("Note: " + commentVal.trim());
    var body = new URLSearchParams();
    body.append(E.no, D.n); body.append(E.code, D.c || ""); body.append(E.name, (nameVal || "").trim() || D.cn || "Client");
    body.append(E.resp, pick.paid ? "Payment sent" : "Order received"); body.append(E.notes, notes.join("\n").slice(0, 1800));
    b.disabled = true; b.textContent = "Sending…";
    fetch(FORM, {method:"POST", mode:"no-cors", body: body})
      .then(function(){ sent = true; bar.remove();
        var msg = pick.paid ? "Thanks! We'll confirm your payment for " + D.n + " on WhatsApp." : "Thanks for letting us know your order arrived. Enjoy!";
        var wa = D.p ? "https://wa.me/" + D.p + "?text=" + encodeURIComponent((pick.paid ? "I've paid " : "I've received ") + D.n + ".") : "";
        app.innerHTML = '<div class="done"><div class="big">&#10003;</div><h1>Thank you</h1><p>' + esc(msg) + '</p>' + (wa ? '<a class="wa" href="' + wa + '">Back to WhatsApp</a>' : '') + '</div>'; window.scrollTo(0, 0); })
      .catch(function(){ b.disabled = false; b.textContent = "Try again"; drawBar("Couldn't send. Check your connection and try again."); });
  });
  draw();
}

function start(){
if(!D){
  app.innerHTML = '<div class="done"><h1>This link is incomplete</h1><p class="sub">Ask Talli 3D Printing to send it again on WhatsApp.</p></div>';
  bar.remove();
} else if(D.k === "i"){
  invoicePage();
} else {
  document.title = (D.b || "Talli 3D Printing") + " – " + D.n;
  var st = D.l.map(function(){ return {s:"", note:"", miss:false}; }), sent = false;
  var nameVal = D.cn || "", commentVal = "";

  function draw(){
    var h = '<header><div class="logo">T</div><div><h1>' + esc(D.b || "Talli 3D Printing") + '</h1><div class="sub">Quotation ' + esc(D.n) + (D.cn ? ' · for ' + esc(D.cn) : '') + '</div></div></header>';
    h += '<div class="intro">Please check each item and tap <b>Approve</b> or <b>Change</b>, then send your reply.' + (D.v ? '<div class="sub" style="margin-top:4px">Valid until ' + esc(D.v) + '</div>' : '') + '</div>';
    D.l.forEach(function(x, i){
      var s = st[i];
      h += '<div class="ln ' + s.s + (s.need ? ' need' : '') + '" id="ln' + i + '"><div class="top">' + pic(x) + '<div class="tx"><div class="nm">' + esc(x[0]) + '</div><div class="ds">' + cdots(x) + esc(x[1] || "") + '</div>' + qtyLine(x) + '</div><div class="pr">' + money(x[3]) + '</div></div>';
      h += '<div class="acts"><button class="b-ok' + (s.s === "ok" ? " on" : "") + '" data-i="' + i + '" data-a="ok" aria-pressed="' + (s.s === "ok") + '">&#10003; Approve</button><button class="b-ch' + (s.s === "ch" ? " on" : "") + '" data-i="' + i + '" data-a="ch" aria-pressed="' + (s.s === "ch") + '">&#9998; Change</button></div>';
      if(s.s === "ch"){
        h += '<textarea data-n="' + i + '" placeholder="What should we change? e.g. make it pink" aria-label="Change for ' + esc(x[0]) + '">' + esc(s.note) + '</textarea><div class="chips">' +
          ["Colour","Size","Quantity","Text","Design"].map(function(c){ return '<button data-c="' + i + '" data-v="' + c + '">' + c + '</button>'; }).join("") + '</div>' +
          (s.miss ? '<div class="err">Tell us what to change</div>' : '');
      }
      h += '</div>';
    });
    h += '<div class="card"><div class="row"><span>Total</span><span class="tot">' + money(D.t) + '</span></div>' + (D.x ? '<div class="sub">' + esc(D.x) + '</div>' : '') + '</div>';
    h += '<div class="card"><label for="nm">Your name</label><input id="nm" value="' + esc(nameVal) + '" autocomplete="name"><label for="cm">Anything else? (optional)</label><textarea id="cm" placeholder="Delivery time, gift wrap, questions…">' + esc(commentVal) + '</textarea></div>';
    app.innerHTML = h;
    drawBar();
  }
  function drawBar(msg){
    var k = st.filter(function(s){ return s.s; }).length, c = st.filter(function(s){ return s.s === "ch"; }).length;
    bar.innerHTML = '<div class="in"><div class="prog" id="prog"' + (msg ? ' style="color:#b42318"' : '') + '>' + (msg || (k + ' of ' + st.length + ' items checked' + (c ? ' · ' + c + ' change' + (c > 1 ? 's' : '') : ''))) + '</div><button id="all">Approve all</button><button class="send" id="send">Send reply</button></div>';
  }

  app.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    if(b.dataset.a){
      var i = +b.dataset.i;
      st[i].s = st[i].s === b.dataset.a ? "" : b.dataset.a; st[i].miss = false; st[i].need = false;
      draw();
      if(st[i].s === "ch"){ var t = document.querySelector('[data-n="' + i + '"]'); if(t) t.focus(); }
    }
    if(b.dataset.c){
      var j = +b.dataset.c;
      st[j].note = (st[j].note ? st[j].note.replace(/\s+$/, "") + ", " : "") + b.dataset.v + ": ";
      st[j].miss = false; draw();
      var t2 = document.querySelector('[data-n="' + j + '"]');
      if(t2){ t2.focus(); t2.setSelectionRange(t2.value.length, t2.value.length); }
    }
  });
  app.addEventListener("input", function(e){
    if(e.target.dataset.n != null) st[+e.target.dataset.n].note = e.target.value;
    if(e.target.id === "nm") nameVal = e.target.value;
    if(e.target.id === "cm") commentVal = e.target.value;
  });

  bar.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b || sent) return;
    if(b.id === "all"){ st.forEach(function(s){ if(!s.s){ s.s = "ok"; s.need = false; } }); draw(); return; }
    if(b.id !== "send") return;
    var first = -1;
    st.forEach(function(s, i){
      if(!s.s){ s.need = true; if(first < 0) first = i; }
      if(s.s === "ch" && !s.note.trim()){ s.miss = true; if(first < 0) first = i; }
    });
    if(first >= 0){ draw(); drawBar("Answer every item first"); document.getElementById("ln" + first).scrollIntoView({behavior:"smooth", block:"center"}); return; }

    var changes = D.l.map(function(x, i){ return st[i].s === "ch" ? x[0] + ": " + st[i].note.trim() : ""; }).filter(Boolean);
    var approved = D.l.filter(function(x, i){ return st[i].s === "ok"; }).map(function(x){ return x[0]; });
    var notes = changes.join("\n");
    if(changes.length && approved.length) notes += "\nApproved: " + approved.join(", ");
    if(commentVal.trim()) notes += (notes ? "\n" : "") + "Note: " + commentVal.trim();
    notes = "[Approval page]" + (notes ? "\n" + notes : "");

    var body = new URLSearchParams();
    body.append(E.no, D.n); body.append(E.code, D.c || ""); body.append(E.name, (nameVal || "").trim() || D.cn || "Client");
    body.append(E.resp, changes.length ? "Request changes" : "Approve as quoted"); body.append(E.notes, notes.slice(0, 1800));

    b.disabled = true; b.textContent = "Sending…";
    fetch(FORM, {method:"POST", mode:"no-cors", body: body})
      .then(function(){ sent = true; done(changes.length); })
      .catch(function(){ b.disabled = false; b.textContent = "Try again"; drawBar("Couldn't send. Check your connection and try again."); });
  });

  function done(ch){
    bar.remove();
    var msg = ch ? "Thanks! We've got your changes for " + D.n + ". We'll update the quote and send it back on WhatsApp."
                 : "Thanks for approving " + D.n + "! We'll start on your order and keep you posted on WhatsApp.";
    var wa = D.p ? "https://wa.me/" + D.p + "?text=" + encodeURIComponent((ch ? "I've sent my changes for " : "I've approved ") + D.n + ".") : "";
    app.innerHTML = '<div class="done"><div class="big">&#10003;</div><h1>Reply sent</h1><p>' + esc(msg) + '</p>' + (wa ? '<a class="wa" href="' + wa + '">Back to WhatsApp</a>' : '') + '</div>';
    window.scrollTo(0, 0);
  }
  draw();
}
}

// ---------- short links: ?k=<12-char key>; the details are stored encrypted in the Talli link store sheet ----------
var STORE_SHEET = "1Z1U1eL7RAJiCRhAOU8O9AnjTfTl6ANzCMU_k1TBNogM", STORE_GID = "383189794";
function sha(s){ return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function(b){ return new Uint8Array(b); }); }
function hex(u){ return Array.prototype.map.call(u, function(x){ return ("0" + x.toString(16)).slice(-2); }).join(""); }
function openBox(k, b64){
  var raw = atob(b64), bytes = new Uint8Array(raw.length);
  for(var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  return sha("talli-key:" + k)
    .then(function(kb){ return crypto.subtle.importKey("raw", kb, "AES-GCM", false, ["decrypt"]); })
    .then(function(key){ return crypto.subtle.decrypt({name:"AES-GCM", iv:bytes.slice(0, 12)}, key, bytes.slice(12)); })
    .then(function(pt){ var d = JSON.parse(new TextDecoder().decode(pt)); if(!(d && d.n && Array.isArray(d.l))) throw 0; return d; });
}
function loadShort(k, tries){
  sha("talli-id:" + k).then(function(h){
    var id = hex(h).slice(0, 24), cb = "talli" + Date.now(), s = document.createElement("script"), settled = false;
    function again(){
      if(settled) return; settled = true; s.remove(); try{ delete window[cb]; }catch(e){}
      if(tries < 5) setTimeout(function(){ loadShort(k, tries + 1); }, 2000);
      else { app.innerHTML = '<div class="done"><h1>This link isn\'t ready yet</h1><p class="sub">Please try again in a minute, or ask Talli 3D Printing to send it again on WhatsApp.</p></div>'; }
    }
    window[cb] = function(r){
      var v = null;
      try{ v = r.table.rows[0].c[0].v; }catch(e){}
      if(!v){ again(); return; }
      settled = true; s.remove();
      openBox(k, v).then(function(d){ D = d; bar.style.display = ""; start(); })
        .catch(function(){ app.innerHTML = '<div class="done"><h1>This link is incomplete</h1><p class="sub">Ask Talli 3D Printing to send it again on WhatsApp.</p></div>'; });
    };
    s.onerror = again;
    setTimeout(again, 12000);
    s.src = "https://docs.google.com/spreadsheets/d/" + STORE_SHEET + "/gviz/tq?gid=" + STORE_GID + "&tqx=responseHandler:" + cb +
      "&tq=" + encodeURIComponent("select C where B = '" + id + "' order by A desc limit 1");
    document.head.appendChild(s);
  });
}
var K = (location.search.match(/[?&]k=([A-Za-z0-9]{12})(?:&|$)/) || [])[1];
if(!D && K && window.crypto && crypto.subtle){
  app.innerHTML = '<div class="done"><p class="sub">Loading your details…</p></div>';
  bar.style.display = "none";
  loadShort(K, 0);
} else start();
</script>
</body>
</html>
